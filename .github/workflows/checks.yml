# The readers against the vectors, and the examples against the example record,
# on the oldest supported Python (3.10) and Node (20).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: python -m pip install -r python/requirements.txt
      - run: make check
